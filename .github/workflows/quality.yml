name: Workspace quality
on:
  push:
  pull_request:
jobs:
  sample-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts
      - run: python scripts/validate_skills.py
      - run: python scripts/create_demo.py --out artifacts/demo
      - run: python scripts/audit_artifacts.py artifacts/demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-research-design-demos
          path: artifacts/demo
          retention-days: 7
