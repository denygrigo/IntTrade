name: Render sample presentations
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/render_decks.py
      - scripts/create_demo.py
      - .github/workflows/visual-preview.yml
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install office renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-liberation
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - run: python scripts/create_demo.py --out artifacts/demo
      - run: python scripts/render_decks.py artifacts/demo --out artifacts/preview
      - name: Upload slide renders and contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: rendered-synthetic-decks
          path: artifacts/preview
          retention-days: 7
